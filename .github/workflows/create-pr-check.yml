name: Create PR check

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened

permissions:
  contents: read
  statuses: write

jobs:
  create-status:
    name: Create commit status on PR head
    runs-on: ubuntu-latest
    steps:
      - name: Set the preview URL and PR head SHA
        run: |
          echo "PREVIEW_URL=https://example.com/doc/" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Create the commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: "success",
              target_url: process.env.PREVIEW_URL,
              context: "docs-preview",
              description: "Documentation preview ready!",
            });

            core.info(`Status "docs-preview" created on ${process.env.HEAD_SHA}`);
