name: Create PR check

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened

permissions:
  contents: read
  checks: write

jobs:
  create-check:
    name: Create check run on PR head
    runs-on: ubuntu-latest
    steps:
      - name: Set the preview URL and PR head SHA
        run: |
          echo "PREVIEW_URL=https://example.com/doc/" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Create the check run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "docs-preview",
              head_sha: process.env.HEAD_SHA,
              status: "completed",
              conclusion: "success",
              details_url: process.env.PREVIEW_URL,
              output: {
                title: "Documentation preview ready!",
                summary: `The rendered documentation is available at ${process.env.PREVIEW_URL}`,
              },
            });

            core.info(`Check "docs-preview" created on ${process.env.HEAD_SHA}`);
