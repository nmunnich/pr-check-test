name: Create PR check

on:
  workflow_dispatch

permissions:
  contents: read
  checks: write

jobs:
  create-check:
    name: Create check run on PR head
    runs-on: ubuntu-latest
    steps:
      - name: Set the preview URL
        run: echo "PREVIEW_URL=https://example.com/doc/" >> "$GITHUB_ENV"

      - name: Create the check run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "docs-preview",
              head_sha: context.sha,
              status: "completed",
              conclusion: "success",
              details_url: process.env.PREVIEW_URL,
              output: {
                title: "Documentation preview ready!",
                summary: `The rendered documentation is available at ${process.env.PREVIEW_URL}`,
              },
            });

            core.info(`Check "docs-preview" created on ${context.sha}`);
